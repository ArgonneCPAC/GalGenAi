models:
  cfm:
    base_channels: 16

training:
  cfm:
    epochs: 4096
    lr: 5.0e-4            # Max LR
    lr_min_factor: 2.0e-2 # decay ends at this * lr
    warmup_epochs: 8      # Epochs in LR ramp up from 0 to lr
    weight_decay: 0.01    # Adamw's weight decay
    max_grad_norm: 1.0    # Gradient norm clipping
    sample_every: 128
    num_sample_images: 16
    train_on_noiseless: true
    validate_every: 1
    save_every: 64
    log_every: 1

