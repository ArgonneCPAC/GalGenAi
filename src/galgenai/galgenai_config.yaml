models:
  vae:
    latent_dim: 32
  cnf:
    num_blocks: 8
    hidden_dim: 256
  cfm:
    base_channels: 16

training:
  vae:
    epochs: 30
    lr: 0.0001
    lr_min_factor: 0.01
    weight_decay: 0.01
    max_grad_norm: 1.0
    beta: 1.0e-08
    reconstruction_loss_fn: masked_weighted_mse
    compute_loss_on_noiseless: true
    save_every: 8
    validate_every: 5
    log_every: 1
  cnf:
    epochs: 32
    lr: 0.0001
    lr_min_factor: 0.01
    weight_decay: 0.01
    max_grad_norm: 1.0
    warmup_epochs: 2
    num_sample_latents: 64
    sample_every: 1
    validate_every: 1
    save_every: 8
    log_every: 1
  cfm:
    epochs: 64
    lr: 0.001
    lr_min_factor: 0.01
    weight_decay: 0.01
    max_grad_norm: 1.0
    warmup_epochs: 2
    sample_every: 8
    num_sample_images: 16
    train_on_noiseless: true
    validate_every: 1
    save_every: 8
    log_every: 1
