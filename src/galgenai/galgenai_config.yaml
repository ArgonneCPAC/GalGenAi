datasets:
  cosmos:
    path: /home/bbiswas/HSC_dataset/
    metadata_file: metadata.csv
    num_workers: 8
    # Decode the dataset into RAM once at startup (much faster per
    # sample, at the cost of memory)
    load_all_in_memory: false
    invert_mask: true
    augment_train: true
    train_ratio: 0.6
    val_ratio: 0.2
    split_seed: 42
    mag_sentinel: 999.0
    redshift_sentinel: -99.0
    mag_cols:
      - mag_model_hsc-g
      - mag_model_hsc-r
      - mag_model_hsc-i
      - mag_model_hsc-z
      - mag_model_hsc-y
