results_dir: pipeline_output/default

data:
  image_size: 32
  batch_size: 64
  in_channels: 5
  image_norm_type: arcsinh
  conditioning_mode: sersic # or choose bulge+disk
  condition_cols_sersic:
    - mag_model_hsc-g
    - mag_model_hsc-r
    - mag_model_hsc-i
    - mag_model_hsc-z
    - mag_model_hsc-y
    - zfinal
    - radius_sersic
